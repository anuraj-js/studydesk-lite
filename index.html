<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#3B82F6" />
  <title>StudyDesk Lite</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/features.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="data:,">
  <script src="js/theme.js"></script>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="nav-brand">
      <img src="images/studydesk_lite_logo.svg" alt="StudyDesk Lite" />
    </a>

    <button class="hamburger" id="hamburgerBtn">
      <i class="fa-solid fa-bars"></i>
    </button>

    <div class="nav-menu" id="navMenu">
      <div class="nav-links">
        <a href="index.html" class="active"><i class="fa-solid fa-house"></i> Home</a>
        <a href="html/tasks.html"><i class="fa-solid fa-list-check"></i> Tasks</a>
        <a href="html/exams.html"><i class="fa-solid fa-book-open"></i> Exams</a>
        <a href="html/pomodoro.html"><i class="fa-solid fa-clock"></i> Pomodoro</a>
        <a href="html/notes.html"><i class="fa-solid fa-note-sticky"></i> Notes</a>
      </div>
      <div class="nav-right-actions">
        <button id="resetAll" class="reset-btn" title="Reset all data">
          <i class="fa-solid fa-rotate-left"></i>
        </button>
        <button id="themeToggle" class="theme-btn"></button>
      </div>
    </div>
    <!-- Backdrop for mobile menu -->
    <div class="nav-backdrop" id="navBackdrop"></div>
  </nav>

  <div class="container">

    <div class="card hero">
      <h1 id="greeting">Hello!</h1>
      <p class="subtitle" id="studyMessage"></p>
      <div class="clock" id="clock">--:--:--</div>
      <div class="date-str" id="date">Loading…</div>
      <button class="clock-toggle" id="clockToggle"></button>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="statPending">0</div>
        <div class="stat-label">Pending Tasks</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statCompleted">0</div>
        <div class="stat-label">Done Tasks</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statExam">—</div>
        <div class="stat-label">Next Exam</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statSessions">0</div>
        <div class="stat-label">Focus Sessions Today</div>
      </div>
    </div>

    <!-- Calendar Widget -->
    <div class="card calendar-card">
      <div class="calendar-header">
        <h2 class="section-title" style="margin:0"><i class="fa-solid fa-calendar-days" style="color:var(--accent); margin-right:0.5rem;"></i> Calendar</h2>
      </div>

      <div class="calendar-controls">
        <div class="cal-month-title">
          <div id="calMonthYear" style="font-size:1.2rem; font-weight:700;">Loading...</div>
        </div>
        <div class="cal-nav">
          <button class="btn btn-ghost btn-sm" id="prevMonth"><i class="fa-solid fa-chevron-left"></i></button>
          <button class="btn btn-primary btn-sm" id="todayBtn">Today</button>
          <button class="btn btn-ghost btn-sm" id="nextMonth"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
      </div>

      <div class="calendar-days-header">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
      </div>
      
      <div class="calendar-grid" id="calendarGrid">
        <!-- JavaScript will inject the days here -->
      </div>
    </div>

    <div class="card">
      <div class="row">
        <h2 class="section-title" style="margin:0">Pending Tasks</h2>
        <a href="html/tasks.html" style="font-size:.82rem;color:var(--accent);text-decoration:none">View all <i class="fa-solid fa-arrow-right"></i></a>
      </div>
      <div id="recentTasks"></div>
    </div>

    <div class="card">
      <div class="row">
        <h2 class="section-title" style="margin:0">Upcoming Exams</h2>
        <a href="html/exams.html" style="font-size:.82rem;color:var(--accent);text-decoration:none">View all <i class="fa-solid fa-arrow-right"></i></a>
      </div>
      <div id="upcomingExams"></div>
    </div>

    <details class="card collapsible-card">
      <summary class="section-title">
        <i class="fa-solid fa-gear"></i> Settings
      </summary>
      <div>
        <div class="form-group">
          <label for="usernameInput">Display Name</label>
          <div style="display:flex;gap:.5rem">
            <input type="text" id="usernameInput" placeholder="Enter your name" />
            <button class="btn btn-primary" id="saveUsername">
              <i class="fa-solid fa-floppy-disk"></i> Save
            </button>
          </div>
        </div>
        <div class="form-group" style="margin-bottom:0">
          <label>Data Backup</label>
          <div style="display:flex;gap:.5rem;flex-wrap:wrap">
            <button class="btn btn-ghost" id="importBtn">
              <i class="fa-solid fa-upload"></i> Import
            </button>
            <button class="btn btn-ghost" id="exportBtn">
              <i class="fa-solid fa-download"></i> Export
            </button>
            <input type="file" id="importInput" accept=".json" style="display:none" />
          </div>
        </div>
      </div>
    </details>

  </div>

  <!-- Day Events Modal -->
  <div class="modal-overlay" id="dayModal" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h3 id="dayModalTitle">Date</h3>
        <button class="modal-close" id="dayModalClose"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="dayModalBody" style="padding: 0.5rem 0; max-height: 60vh; overflow-y: auto;">
        <!-- Injected by JS -->
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/calendar.js"></script>
</body>
</html>
