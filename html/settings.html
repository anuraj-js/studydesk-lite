<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings · StudyDesk Lite</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/features.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <link rel="icon" href="data:,">
  <script src="../js/theme.js"></script>
</head>
<body>

  <div id="appShell"></div>

  <div class="container">
    <h1 class="section-title" style="margin-bottom: 1.5rem;"><i class="fa-solid fa-gear"></i> Settings</h1>

    <!-- Profile -->
    <div class="card">
      <h2 class="section-title" style="margin-bottom: 1rem;"><i class="fa-solid fa-user"></i> Profile</h2>
      <div class="form-group" style="margin-bottom: 0;">
        <label for="usernameInput">Display Name</label>
        <div style="display:flex;gap:.5rem">
          <input type="text" id="usernameInput" placeholder="Enter your name" />
          <button class="btn btn-primary" id="saveUsernameBtn" style="transition: all 0.3s;">
            <i class="fa-solid fa-floppy-disk"></i> <span id="saveUsernameBtnText">Save Changes</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Data Backup -->
    <div class="card">
      <h2 class="section-title" style="margin-bottom: 1rem;"><i class="fa-solid fa-database"></i> Data Backup</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem;">
        Export your data to a JSON file to back it up or move it to another device.
      </p>
      <div style="display:flex;gap:.5rem;flex-wrap:wrap">
        <button class="btn btn-ghost" id="importBtn">
          <i class="fa-solid fa-upload"></i> Import JSON
        </button>
        <button class="btn btn-ghost" id="exportBtn">
          <i class="fa-solid fa-download"></i> Export JSON
        </button>
        <input type="file" id="importInput" accept=".json" style="display:none" />
      </div>
    </div>

    <!-- Danger Zone -->
    <div class="card" style="border-color: var(--danger);">
      <h2 class="section-title" style="margin-bottom: 1rem; color: var(--danger);"><i class="fa-solid fa-triangle-exclamation"></i> Danger Zone</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem;">
        Permanently delete all your tasks, exams, notes, and settings. This action cannot be undone.
      </p>
      <button class="btn btn-danger" id="resetAll">
        <i class="fa-solid fa-trash"></i> Reset All Data
      </button>
    </div>

  </div>

  <!-- Scripts -->
  <script src="../js/utils.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/dialog.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/settings.js"></script>
</body>
</html>
