<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#3B82F6" />
  <title>Exams · StudyDesk Lite</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="manifest" href="../manifest.json" />
  <link rel="icon" href="data:,">
  <script src="../js/theme.js"></script>
</head>
<body>

  <nav class="navbar">
    <a href="../index.html" class="nav-brand">
      <i class="fa-solid fa-book-bookmark"></i> StudyDesk Lite
    </a>
    <div class="nav-links">
      <a href="../index.html"><i class="fa-solid fa-house"></i> Home</a>
      <a href="tasks.html"><i class="fa-solid fa-list-check"></i> Tasks</a>
      <a href="exams.html"><i class="fa-solid fa-book-open"></i> Exams</a>
      <a href="pomodoro.html"><i class="fa-solid fa-clock"></i> Pomodoro</a>
    </div>
    <div style="display:flex;gap:.5rem;align-items:center">
      <button id="resetAll" class="reset-btn" title="Reset all data">
        <i class="fa-solid fa-rotate-left"></i>
      </button>
      <button id="themeToggle" class="theme-btn"></button>
    </div>
  </nav>

  <div class="container">

    <div class="card">
      <h2 class="section-title">Add Exam</h2>
      <form id="examForm">
        <div class="form-group">
          <label for="examName">Exam name <span class="required">*</span></label>
          <input type="text" id="examName" placeholder="e.g. Midterm, Final, Pre-Board" required />
        </div>
        <div class="form-group">
          <label for="examSubject">Subject <span class="required">*</span></label>
          <input type="text" id="examSubject" placeholder="e.g. Physics, Chemistry, Mathematics" required />
        </div>
        <div class="form-group">
          <label for="examDate">Exam date <span class="required">*</span></label>
          <input type="date" id="examDate" required />
        </div>
        <button type="submit" class="btn btn-primary btn-full">
          <i class="fa-solid fa-plus"></i> Create exam plan
        </button>
      </form>
    </div>

    <div id="examList"></div>

  </div>

  <!-- Edit Modal -->
  <div class="modal-overlay" id="editModal" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h3><i class="fa-solid fa-pen"></i> Edit Exam</h3>
        <button class="modal-close" id="modalClose"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="editExamForm">
        <input type="hidden" id="editExamId" />
        <div class="form-group">
          <label for="editExamName">Exam name <span class="required">*</span></label>
          <input type="text" id="editExamName" required />
        </div>
        <div class="form-group">
          <label for="editExamSubject">Subject <span class="required">*</span></label>
          <input type="text" id="editExamSubject" required />
        </div>
        <div class="form-group">
          <label for="editExamDate">Exam date <span class="required">*</span></label>
          <input type="date" id="editExamDate" required />
        </div>
        <div style="display:flex;gap:.5rem">
          <button type="button" class="btn btn-ghost" id="modalCancel">Cancel</button>
          <button type="submit" class="btn btn-primary" style="flex:1">
            <i class="fa-solid fa-floppy-disk"></i> Save Changes
          </button>
        </div>
      </form>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="../index.html"><i class="fa-solid fa-house nav-icon"></i><span>Home</span></a>
    <a href="tasks.html"><i class="fa-solid fa-list-check nav-icon"></i><span>Tasks</span></a>
    <a href="exams.html"><i class="fa-solid fa-book-open nav-icon"></i><span>Exams</span></a>
    <a href="pomodoro.html"><i class="fa-solid fa-clock nav-icon"></i><span>Pomodoro</span></a>
  </nav>

  <script src="../js/storage.js"></script>
  <script src="../js/exams.js"></script>
</body>
</html>
