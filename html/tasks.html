<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#3B82F6" />
  <title>Tasks · StudyDesk Lite</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="manifest" href="../manifest.json" />
  <script src="../js/theme.js"></script>
</head>
<body>

  <nav class="navbar">
    <a href="../index.html" class="nav-brand">
      <i class="fa-solid fa-book-bookmark"></i> StudyDesk Lite
    </a>
    <div class="nav-links">
      <a href="../index.html"><i class="fa-solid fa-house"></i> Home</a>
      <a href="tasks.html"><i class="fa-solid fa-list-check"></i> Tasks</a>
      <a href="exams.html"><i class="fa-solid fa-book-open"></i> Exams</a>
      <a href="pomodoro.html"><i class="fa-solid fa-clock"></i> Pomodoro</a>
    </div>
    <div style="display:flex;gap:.5rem;align-items:center">
      <button id="resetAll" class="reset-btn" title="Reset all data">
        <i class="fa-solid fa-rotate-left"></i>
      </button>
      <button id="themeToggle" class="theme-btn"></button>
    </div>
  </nav>

  <div class="container">

    <div class="card">
      <h2 class="section-title">Add Task</h2>
      <form id="taskForm">
        <div class="form-group">
          <label for="taskTitle">Task <span class="required">*</span></label>
          <input type="text" id="taskTitle" placeholder="What do you need to do?" required />
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label for="taskPriority">Priority <span class="required">*</span></label>
            <select id="taskPriority">
              <option value="high">High</option>
              <option value="medium" selected>Medium</option>
              <option value="low">Low</option>
            </select>
          </div>
          <div class="form-group">
            <label for="taskDue">Due Date <span class="required">*</span></label>
            <input type="date" id="taskDue" required />
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-full">
          <i class="fa-solid fa-plus"></i> Add Task
        </button>
      </form>
    </div>

    <div class="filter-tabs">
      <button class="filter-tab active" data-filter="all">All</button>
      <button class="filter-tab" data-filter="active">Active</button>
      <button class="filter-tab" data-filter="completed">Completed</button>
      <button class="filter-tab" data-filter="overdue">
        Overdue <span class="tab-count" id="overdueCount" style="display:none">0</span>
      </button>
    </div>

    <div id="taskList"></div>

  </div>

  <nav class="bottom-nav">
    <a href="../index.html"><i class="fa-solid fa-house nav-icon"></i><span>Home</span></a>
    <a href="tasks.html"><i class="fa-solid fa-list-check nav-icon"></i><span>Tasks</span></a>
    <a href="exams.html"><i class="fa-solid fa-book-open nav-icon"></i><span>Exams</span></a>
    <a href="pomodoro.html"><i class="fa-solid fa-clock nav-icon"></i><span>Pomodoro</span></a>
  </nav>

  <script src="../js/storage.js"></script>
  <script src="../js/tasks.js"></script>
</body>
</html>
