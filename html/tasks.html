<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#3B82F6" />
  <title>Tasks · StudyDesk Lite</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <link rel="manifest" href="../manifest.json" />
  <link rel="icon" href="data:,">
  <script src="../js/theme.js"></script>
</head>
<body>

  <nav class="navbar">
    <a href="../index.html" class="nav-brand">
      <img src="../images/studydesk_lite_logo.svg" alt="StudyDesk Lite" />
    </a>

    <button class="hamburger" id="hamburgerBtn">
      <i class="fa-solid fa-bars"></i>
    </button>

    <div class="nav-menu" id="navMenu">
      <div class="nav-links">
        <a href="../index.html"><i class="fa-solid fa-house"></i> Home</a>
        <a href="tasks.html" class="active"><i class="fa-solid fa-list-check"></i> Tasks</a>
        <a href="exams.html"><i class="fa-solid fa-book-open"></i> Exams</a>
        <a href="pomodoro.html"><i class="fa-solid fa-clock"></i> Pomodoro</a>
        <a href="notes.html"><i class="fa-solid fa-note-sticky"></i> Notes</a>
      </div>
      <div class="nav-right-actions">
        <button id="resetAll" class="reset-btn" title="Reset all data">
          <i class="fa-solid fa-rotate-left"></i>
        </button>
        <button id="themeToggle" class="theme-btn"></button>
      </div>
    </div>
    <!-- Backdrop for mobile menu -->
    <div class="nav-backdrop" id="navBackdrop"></div>
  </nav>

  <div class="container">

    <details class="card collapsible-card">
      <summary class="section-title">
        <i class="fa-solid fa-plus-circle"></i> Add Task
      </summary>
      <form id="taskForm">
        <div class="form-group">
          <label for="taskTitle">Task <span class="required">*</span></label>
          <input type="text" id="taskTitle" placeholder="What do you need to do?" required />
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label for="taskPriority">Priority <span class="required">*</span></label>
            <select id="taskPriority">
              <option value="high">High</option>
              <option value="medium" selected>Medium</option>
              <option value="low">Low</option>
            </select>
          </div>
          <div class="form-group">
            <label for="taskDue">Due Date <span class="required">*</span></label>
            <input type="date" id="taskDue" required />
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-full">
          <i class="fa-solid fa-plus"></i> Add Task
        </button>
      </form>
    </details>

    <div class="filter-tabs">
      <button class="filter-tab active" data-filter="all">All</button>
      <button class="filter-tab" data-filter="active">Active</button>
      <button class="filter-tab" data-filter="completed">Completed</button>
      <button class="filter-tab" data-filter="overdue">
        Overdue <span class="tab-count" id="overdueCount" style="display:none">0</span>
      </button>
    </div>

    <div id="taskList"></div>

  </div>

  <!-- Edit Task Modal -->
  <div class="modal-overlay" id="editTaskModal" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h3><i class="fa-solid fa-pen"></i> Edit Task</h3>
        <button class="modal-close" id="editTaskModalClose"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="editTaskForm">
        <input type="hidden" id="editTaskId" />
        <div class="form-group">
          <label for="editTaskTitle">Task <span class="required">*</span></label>
          <input type="text" id="editTaskTitle" required />
        </div>
        <div class="grid-2">
          <div class="form-group">
            <label for="editTaskPriority">Priority <span class="required">*</span></label>
            <select id="editTaskPriority">
              <option value="high">High</option>
              <option value="medium">Medium</option>
              <option value="low">Low</option>
            </select>
          </div>
          <div class="form-group">
            <label for="editTaskDue">Due Date <span class="required">*</span></label>
            <input type="date" id="editTaskDue" required />
          </div>
        </div>
        <div style="display:flex;gap:.5rem;margin-top:1rem">
          <button type="button" class="btn btn-ghost" id="editTaskModalCancel">Cancel</button>
          <button type="submit" class="btn btn-primary" style="flex:1">
            <i class="fa-solid fa-floppy-disk"></i> Save Changes
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/tasks.js"></script>
  <script src="../js/nav.js"></script>
</body>
</html>
