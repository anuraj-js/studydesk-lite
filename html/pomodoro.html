<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#3B82F6" />
  <title>Pomodoro · StudyDesk Lite</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="manifest" href="../manifest.json" />
  <script src="../js/theme.js"></script>
</head>
<body>

  <nav class="navbar">
    <a href="../index.html" class="nav-brand">
      <i class="fa-solid fa-book-bookmark"></i> StudyDesk Lite
    </a>
    <div class="nav-links">
      <a href="../index.html"><i class="fa-solid fa-house"></i> Home</a>
      <a href="tasks.html"><i class="fa-solid fa-list-check"></i> Tasks</a>
      <a href="exams.html"><i class="fa-solid fa-book-open"></i> Exams</a>
      <a href="pomodoro.html"><i class="fa-solid fa-clock"></i> Pomodoro</a>
    </div>
    <div style="display:flex;gap:.5rem;align-items:center">
      <button id="resetAll" class="reset-btn" title="Reset all data">
        <i class="fa-solid fa-rotate-left"></i>
      </button>
      <button id="themeToggle" class="theme-btn"></button>
    </div>
  </nav>

  <div class="container">

    <div class="card pomodoro-display">
      <div class="mode-label" id="modeLabel">Focus Time</div>
      <div class="timer-display" id="timerDisplay">25:00</div>
      <div class="session-info" id="sessionInfo">Session 1 · 0 completed today</div>
      <button class="btn btn-ghost btn-sm" id="resetSessions" style="margin-bottom:1rem;font-size:0.75rem">
        <i class="fa-solid fa-rotate-left"></i> Reset Sessions
      </button>
      <div class="timer-controls">
        <button class="btn btn-ghost" id="resetBtn">
          <i class="fa-solid fa-rotate-left"></i> Reset
        </button>
        <button class="btn btn-primary" id="startBtn" style="min-width:110px">
          <i class="fa-solid fa-play"></i> Start
        </button>
        <button class="btn btn-ghost" id="skipBtn">
          <i class="fa-solid fa-forward-step"></i> Skip
        </button>
      </div>
      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>

    <div class="card">
      <h2 class="section-title">Settings</h2>
      <div class="settings-row">
        <label>Focus</label>
        <div class="settings-time-inputs">
          <input type="number" id="setWork" min="0" max="90" />
          <span class="settings-time-sep">min</span>
          <input type="number" id="setWorkSec" min="0" max="59" />
          <span class="settings-time-sep">sec</span>
        </div>
      </div>
      <div class="settings-row">
        <label>Short Break</label>
        <div class="settings-time-inputs">
          <input type="number" id="setShort" min="0" max="30" />
          <span class="settings-time-sep">min</span>
          <input type="number" id="setShortSec" min="0" max="59" />
          <span class="settings-time-sep">sec</span>
        </div>
      </div>
      <div class="settings-row">
        <label>Long Break</label>
        <div class="settings-time-inputs">
          <input type="number" id="setLong" min="0" max="60" />
          <span class="settings-time-sep">min</span>
          <input type="number" id="setLongSec" min="0" max="59" />
          <span class="settings-time-sep">sec</span>
        </div>
      </div>
      <div class="settings-row">
        <label>Long Break After (sessions)</label>
        <input type="number" id="setLongAfter" min="1" max="10" />
      </div>
    </div>

  </div>

  <nav class="bottom-nav">
    <a href="../index.html"><i class="fa-solid fa-house nav-icon"></i><span>Home</span></a>
    <a href="tasks.html"><i class="fa-solid fa-list-check nav-icon"></i><span>Tasks</span></a>
    <a href="exams.html"><i class="fa-solid fa-book-open nav-icon"></i><span>Exams</span></a>
    <a href="pomodoro.html"><i class="fa-solid fa-clock nav-icon"></i><span>Pomodoro</span></a>
  </nav>

  <script src="../js/storage.js"></script>
  <script src="../js/pomodoro.js"></script>
</body>
</html>
